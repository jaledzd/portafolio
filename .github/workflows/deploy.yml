name: Portfolio CI/CD

on:
  push:
    branches:
      - release
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/lambda/contact/package-lock.json

      - name: Install Lambda dependencies
        working-directory: backend/lambda/contact
        run: npm ci

      - name: Build Lambda
        working-directory: backend/lambda/contact
        run: npm run build

  deploy:
    name: Deploy frontend to AWS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ s3://portfolio-jaledzd/frontend/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E30NVL765Y3INV \
            --paths "/*"
